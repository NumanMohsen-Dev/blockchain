services:
  # ==============================================================================
  # Blockchain Service (Hardhat Node & Smart Contract Deployment)
  # ==============================================================================
  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: evidence_blockchain
    restart: unless-stopped
    ports:
      - "8545:8545"
    volumes:
      - blockchain_deployments:/app/deployments
    networks:
      - evidence-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8545 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  # ==============================================================================
  # Relational Database Service (PostgreSQL 16)
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: evidence_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evidence_custody}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evidence-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-evidence_custody}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

  # ==============================================================================
  # Backend API Service (FastAPI + Web3.py + SQLAlchemy)
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evidence_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-evidence_custody}
      HARDHAT_RPC_URL: http://blockchain:8545
      CONTRACT_ABI_PATH: /app/deployments/contract_info.json
      EVIDENCE_STORAGE_PATH: /app/storage/evidence
      BACKEND_PORT: 8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development_jwt_secret_key_change_in_production_min_32_chars!}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      SEED_DEMO_USERS: "true"
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - evidence_storage:/app/storage/evidence
      - blockchain_deployments:/app/deployments
    depends_on:
      postgres:
        condition: service_healthy
      blockchain:
        condition: service_healthy
    networks:
      - evidence-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==============================================================================
  # Frontend Dashboard Service (Next.js 14 App Router + Tailwind CSS)
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: evidence_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - evidence-network

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  evidence_storage:
    driver: local
  blockchain_deployments:
    driver: local

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  evidence-network:
    driver: bridge
